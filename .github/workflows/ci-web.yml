# CI — Web cliente (install + build + unit tests)
name: CI Web

on:
  push:
    branches: [master, main]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web install + build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci requires package-lock in sync with package.json.
      # Use npm install if lock is stale (still installs deterministic-enough for CI).
      - name: Install dependencies
        run: |
          if npm ci; then
            echo "npm ci OK"
          else
            echo "::warning::package-lock.json out of sync with package.json — using npm install"
            npm install
          fi

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck (informational)
        continue-on-error: true
        run: npm run check

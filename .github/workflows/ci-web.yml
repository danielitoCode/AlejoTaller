# CI — Web cliente (install + build + unit tests)
name: CI Web

on:
  push:
    branches: [master, main, Core2, Core3, Core4, Core5, Core6]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [master, main, Core2, Core3, Core4, Core5, Core6]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web install + build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # sin cache de lock hasta regenerar package-lock completo en local

      - name: Install dependencies
        run: |
          # El lock mínimo/roto provoca: Cannot read properties of null (reading 'edgesOut')
          # Regenerar árbol desde package.json. Cuando commits un lock completo, se puede volver a npm ci.
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck (informational)
        continue-on-error: true
        run: npm run check

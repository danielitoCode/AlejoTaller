# CI — Web cliente (install + build + unit tests)
name: CI Web

on:
  push:
    branches: [master, main, Core2, Core3, Core4, Core5, Core6]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [master, main, Core2, Core3, Core4, Core5, Core6]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web install + build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Pin npm: algunos 11.x rompen con edgesOut en árboles grandes
      - name: Use npm 10
        run: npm install -g npm@10.9.2

      - name: Install dependencies
        run: |
          npm --version
          # package-lock completo en repo (incl. @clerk/clerk-js) → npm ci
          npm ci --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck (informational)
        continue-on-error: true
        run: npm run check

# CI — Android cliente (:app)
name: CI Android Cliente

on:
  push:
    branches: [master, main, Core2]
    paths:
      - "app/**"
      - "shared-*/**"
      - "mapper-processor/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci-android-client.yml"
  pull_request:
    branches: [master, main, Core2]
    paths:
      - "app/**"
      - "shared-*/**"
      - "mapper-processor/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci-android-client.yml"
  workflow_dispatch:

concurrency:
  group: ci-android-client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-client:
    name: Cliente tests + compile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Placeholder local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Unit tests (:app)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile debug (:app)
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-client-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

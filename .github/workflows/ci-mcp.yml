# CI — Customer MCP Server (typecheck + unit tests)
name: CI MCP

on:
  push:
    branches: [master, main, Core2]
    paths:
      - "mcp/**"
      - ".github/workflows/ci-mcp.yml"
      - ".github/workflows/ci-gate.yml"
  pull_request:
    branches: [master, main, Core2]
    paths:
      - "mcp/**"
      - ".github/workflows/ci-mcp.yml"
      - ".github/workflows/ci-gate.yml"
  workflow_dispatch:

concurrency:
  group: ci-mcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mcp:
    name: MCP typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: |
          set -e
          if npm ci --no-fund --no-audit; then
            echo "npm ci OK"
          else
            echo "::warning::package-lock out of sync or peer conflict — falling back to npm install"
            rm -rf node_modules
            npm install --no-fund --no-audit
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
